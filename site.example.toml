# thinny site settings: /etc/thinny/site.toml
# Edit with: thinny config edit (or edit it directly, then run: thinny config apply)

[hermes]
auto_update = true              # false: the nightly job leaves thinny as it is and only reports a new release
update_time = "03:00"           # nightly update (schedule the OS reboot window after it)
min_release_age_hours = 48      # install a stable release only once it is this old

[policy]
model_provider = "openai-codex"
model = "<model id>"            # default model (with model_lock = false, what instance add suggests)
reasoning_effort = "high"
model_lock = false              # true: every instance uses model_provider, reasoning_effort and allowed_models
                                # only, and the plugins the policy turns on
allowed_models = []             # with model_lock: the model-guard plugin blocks every other model
approvals = "smart"             # manual | smart (never off: every command would run unasked)
language = "en"                 # Hermes UI language (display.language) for new instances
language_pack = ""              # catalog plugin for that language, e.g. "hermes-lang-cs"
model_guard_message = "Model {model} is not allowed on this server. Allowed: {allowed}."  # with model_lock

[container]                     # limits of instances without their own (instance add/limits)
cpu = 2
memory_mb = 4096
disk_gb = 30

[webapp]
port_range = [9120, 9199]       # one local port per instance
theme = "light"                 # light | dark, for new instances
text_scale = 110                # chat text size in %
interface = "simple"
known_models = []               # with model_lock: other model ids the model picker should not announce as new

[access]
default = "lan"                 # lan | tailscale | url | local (asked per instance)
lan_address = "<server LAN IP>" # the address office PCs use (required for lan)
tunnel_port = 0                 # e.g. 8080: Caddy serves every url instance at http://127.0.0.1:<port>, by host
                                # and path, for one tunnel on this server (cloudflared); 0 = off

[network]
interface = "eth0"              # the server's internet interface; containers go out through it
blocked_networks = []           # public networks instance containers may not reach, e.g. ["203.0.113.0/24"]
                                # (private networks and the tailnet are always out of reach)
