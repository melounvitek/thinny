name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The system Pythons of Ubuntu 24.04, Debian 13 and Ubuntu 26.04.
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest pyyaml
      - run: python -m pytest
      # Not covered by the tests.
      - run: python -m py_compile bin/thinny extras/*/*.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --severity=warning install.sh bin/install
